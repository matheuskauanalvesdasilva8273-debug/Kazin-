<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kazin — Subway Surfers</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#08080f;color:#e2e2f0;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;padding-bottom:env(safe-area-inset-bottom,0px)}
header{position:sticky;top:0;z-index:100;background:rgba(8,8,15,.96);backdrop-filter:blur(16px);border-bottom:1px solid #1a1a2e;padding:0 14px;height:52px;display:flex;align-items:center;gap:10px}
.logo{font-size:20px;font-weight:900;letter-spacing:-1px;background:linear-gradient(135deg,#c084fc,#7c3aed);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;flex-shrink:0}
.search-wrap{flex:1;position:relative}
.search-wrap input{width:100%;background:#111120;border:1px solid #1a1a2e;border-radius:8px;padding:7px 12px 7px 32px;color:#e2e2f0;font-size:13px;outline:none;transition:border-color .2s}
.search-wrap input:focus{border-color:#7c3aed}
.search-wrap::before{content:'🔍';position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:12px;pointer-events:none}
.cats{display:flex;gap:6px;padding:10px 14px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid #1a1a2e}
.cats::-webkit-scrollbar{display:none}
.cat{flex-shrink:0;padding:5px 13px;border-radius:20px;border:1px solid #1a1a2e;background:#111120;color:#6b6b8a;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
.cat.on,.cat:hover{background:#7c3aed;border-color:#7c3aed;color:#fff}
main{padding:14px}
.sec{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#6b6b8a;margin-bottom:10px;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:9px;margin-bottom:20px}
.card{background:#111120;border:1px solid #1a1a2e;border-radius:11px;overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);border-color:#7c3aed;box-shadow:0 6px 20px rgba(124,58,237,.3)}
.thumb{width:100%;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;font-size:36px;position:relative;overflow:hidden}
.thumb::after{content:'▶';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);color:#fff;font-size:20px;opacity:0;transition:opacity .15s}
.card:hover .thumb::after{opacity:1}
.info{padding:7px 9px 9px}
.gname{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtag{font-size:10px;color:#6b6b8a;margin-top:2px}
.empty{padding:40px;text-align:center;color:#6b6b8a;font-size:13px;display:none}
/* player */
#ov{display:none;position:fixed;inset:0;z-index:200;background:#000;flex-direction:column}
#ov.open{display:flex}
.pbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#0c0c18;border-bottom:1px solid #1a1a2e;flex-shrink:0}
.back{background:#1a1a2e;border:1px solid #252540;border-radius:7px;color:#e2e2f0;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s;white-space:nowrap}
.back:hover{background:#7c3aed;border-color:#7c3aed}
.ptitle{font-size:14px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fsbtn{background:none;border:1px solid #1a1a2e;border-radius:7px;color:#6b6b8a;padding:6px 10px;font-size:13px;cursor:pointer;flex-shrink:0;transition:color .15s,border-color .15s}
.fsbtn:hover{color:#e2e2f0;border-color:#7c3aed}
#fw{flex:1;position:relative}
#fr{width:100%;height:100%;border:none;display:block}
.ld{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#08080f;transition:opacity .4s}
.ld.h{opacity:0;pointer-events:none}
.sp{width:36px;height:36px;border:3px solid #1a1a2e;border-top-color:#c084fc;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lt{font-size:13px;color:#6b6b8a}
</style>
</head>
<body>

<header>
  <div class="logo">Kazin</div>
  <div class="search-wrap">
    <input id="sq" type="text" placeholder="Buscar versão…" oninput="filter()">
  </div>
</header>

<div class="cats">
  <div class="cat on" onclick="setCat('all',this)">Todos</div>
  <div class="cat" onclick="setCat('europa',this)">🌍 Europa</div>
  <div class="cat" onclick="setCat('americas',this)">🌎 Américas</div>
  <div class="cat" onclick="setCat('asia',this)">🌏 Ásia</div>
  <div class="cat" onclick="setCat('especial',this)">⭐ Especial</div>
</div>

<main>
  <div class="sec">🚇 Versões do Subway Surfers</div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">Nenhuma versão encontrada</div>
</main>

<div id="ov">
  <div class="pbar">
    <button class="back" onclick="closeGame()">← Voltar</button>
    <div class="ptitle" id="ptitle">—</div>
    <button class="fsbtn" onclick="goFS()">⛶ Tela cheia</button>
  </div>
  <div id="fw">
    <div class="ld" id="ld">
      <div class="sp"></div>
      <div class="lt">Carregando o jogo…</div>
    </div>
    <iframe id="fr"
      allow="fullscreen;autoplay;gamepad"
      allowfullscreen
      sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-top-navigation-by-user-activation">
    </iframe>
  </div>
</div>

<script>
const CDN = 'https://cdn.jsdelivr.net/npm/';

const GAMES = [
  // EUROPA
  {id:'london',  name:'Londres',       flag:'🇬🇧', bg:'#1a1040', cats:['europa'],
   pkg:'subwaylondon'},
  {id:'berlin',  name:'Berlim',        flag:'🇩🇪', bg:'#0d1a0d', cats:['europa'],
   pkg:'subwayberlin'},
  {id:'zurich',  name:'Zurique',       flag:'🇨🇭', bg:'#1a0d0d', cats:['europa'],
   pkg:'subwayzurich'},
  // AMÉRICAS
  {id:'miami',   name:'Miami',         flag:'🇺🇸', bg:'#001a1a', cats:['americas'],
   pkg:'subwaymiami'},
  {id:'havana',  name:'Havana',        flag:'🇨🇺', bg:'#1a1500', cats:['americas'],
   pkg:'subwayhavana'},
  {id:'mexico',  name:'México',        flag:'🇲🇽', bg:'#001a08', cats:['americas'],
   pkg:'subwaymexico'},
  // ÁSIA
  {id:'beijing', name:'Pequim',        flag:'🇨🇳', bg:'#1a0000', cats:['asia'],
   pkg:'subwaybeijing'},
  // ESPECIAL
  {id:'winter',  name:'Winter Holiday',flag:'❄️',  bg:'#001020', cats:['especial'],
   pkg:'subwaywinterholiday'},
];

let cat = 'all';

function buildGrid(list) {
  const g = document.getElementById('grid');
  const e = document.getElementById('empty');
  g.innerHTML = '';
  if (!list.length) { e.style.display='block'; return; }
  e.style.display = 'none';
  list.forEach(gm => {
    const c = document.createElement('div');
    c.className = 'card';
    c.innerHTML = `
      <div class="thumb" style="background:linear-gradient(135deg,${gm.bg},#0a0a1a)">
        <span style="font-size:44px">${gm.flag}</span>
      </div>
      <div class="info">
        <div class="gname">Subway Surfers</div>
        <div class="gtag">${gm.name}</div>
      </div>`;
    c.onclick = () => open(gm);
    g.appendChild(c);
  });
}

function filter() {
  const q = document.getElementById('sq').value.toLowerCase().trim();
  let list = GAMES;
  if (cat !== 'all') list = list.filter(g => g.cats.includes(cat));
  if (q) list = list.filter(g => g.name.toLowerCase().includes(q));
  buildGrid(list);
}

function setCat(c, btn) {
  cat = c;
  document.querySelectorAll('.cat').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  filter();
}

function open(gm) {
  document.getElementById('ptitle').textContent = 'Subway Surfers — ' + gm.name;
  const fr = document.getElementById('fr');
  const ld = document.getElementById('ld');
  ld.classList.remove('h');
  fr.src = '';
  document.getElementById('ov').classList.add('open');
  document.body.style.overflow = 'hidden';
  setTimeout(() => {
    fr.src = CDN + gm.pkg + '/index.html';
    fr.onload = () => setTimeout(() => ld.classList.add('h'), 500);
    setTimeout(() => ld.classList.add('h'), 10000);
  }, 100);
}

function closeGame() {
  document.getElementById('fr').src = '';
  document.getElementById('ov').classList.remove('open');
  document.body.style.overflow = '';
}

function goFS() {
  const w = document.getElementById('fw');
  (w.requestFullscreen || w.webkitRequestFullscreen || function(){}).call(w);
}

buildGrid(GAMES);
</script>
</body>
</html>
